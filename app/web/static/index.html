<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频伪造检测平台</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1420; --panel: #18203200; --card: #1b2436; --card2: #212c42;
    --border: #2b3a55; --text: #dbe4f0; --dim: #8595b0;
    --accent: #4f8cff; --green: #3fce8a; --red: #f0637a; --amber: #f0b35e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex;
         flex-direction: column; overflow: hidden; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  header .dot.ok { background: var(--green); }
  header .svc { font-size: 12px; color: var(--dim); }

  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 340px;
         gap: 12px; padding: 12px; min-height: 0; }
  .col { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
         display: flex; flex-direction: column; min-height: 0; }
  .col > h2 { font-size: 13px; padding: 12px 14px; border-bottom: 1px solid var(--border);
              color: var(--dim); font-weight: 600; letter-spacing: .5px; }

  /* ---------- 左栏：上传 + 历史 ---------- */
  #dropzone { margin: 12px; border: 1.5px dashed var(--border); border-radius: 10px;
              padding: 22px 12px; text-align: center; color: var(--dim);
              cursor: pointer; transition: .2s; font-size: 13px; }
  #dropzone:hover, #dropzone.dragover { border-color: var(--accent);
              background: #4f8cff12; color: var(--accent); }
  #dropzone input { display: none; }
  #dropzone .small { font-size: 11px; margin-top: 6px; opacity: .7; }

  #task-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .task { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
          background: var(--card2); border: 1px solid transparent; }
  .task:hover { border-color: var(--border); }
  .task.active { border-color: var(--accent); }
  .task .name { font-size: 12px; font-weight: 600; word-break: break-all; }
  .task .meta { font-size: 11px; color: var(--dim); margin-top: 4px;
                display: flex; justify-content: space-between; }
  .st { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
  .st.pending, .st.running { background: #4f8cff22; color: var(--accent); }
  .st.done { background: #3fce8a22; color: var(--green); }
  .st.failed { background: #f0637a22; color: var(--red); }
  .task .bar { height: 3px; background: #ffffff14; border-radius: 2px; margin-top: 6px; }
  .task .bar > div { height: 100%; background: var(--accent); border-radius: 2px;
                     transition: width .4s; }

  /* ---------- 中栏：报告 ---------- */
  #report-wrap { flex: 1; overflow-y: auto; padding: 18px 22px; }
  #report-empty { color: var(--dim); text-align: center; margin-top: 30vh; font-size: 13px; }
  #report { font-size: 13px; line-height: 1.8; max-width: 760px; }
  #report h1 { font-size: 19px; margin-bottom: 10px; }
  #report h2 { font-size: 15px; margin: 18px 0 8px; padding-bottom: 6px;
               border-bottom: 1px solid var(--border); }
  #report h3 { font-size: 13px; margin: 12px 0 6px; color: var(--accent); }
  #report blockquote { border-left: 3px solid var(--accent); background: #4f8cff10;
                       padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 10px 0; }
  #report strong { color: var(--amber); }
  #report ul, #report ol { padding-left: 20px; }
  .risk { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px;
          margin-left: 8px; vertical-align: middle; }
  .risk.高 { background: #f0637a22; color: var(--red); }
  .risk.中 { background: #f0b35e22; color: var(--amber); }
  .risk.低 { background: #3fce8a22; color: var(--green); }

  /* ---------- 右栏：聊天 ---------- */
  #chat-box { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin-bottom: 10px; display: flex; }
  .msg .bubble { max-width: 88%; padding: 8px 12px; border-radius: 10px;
                 font-size: 12.5px; line-height: 1.7; white-space: pre-wrap;
                 word-break: break-word; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--accent); color: #fff; }
  .msg.assistant .bubble { background: var(--card2); border: 1px solid var(--border); }
  #chat-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  #chat-input { flex: 1; padding: 9px 12px; background: var(--bg);
                border: 1px solid var(--border); border-radius: 8px;
                color: var(--text); font-size: 13px; outline: none; }
  #chat-input:focus { border-color: var(--accent); }
  button { padding: 9px 16px; background: var(--accent); color: #fff; border: none;
           border-radius: 8px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="svc-dot"></span>
  <h1>🎙️ 音频伪造检测平台</h1>
  <span class="svc" id="svc-text">连接中…</span>
</header>

<main>
  <!-- 左栏 -->
  <section class="col">
    <h2>📤 上传检测</h2>
    <div id="dropzone">
      <div>点击选择 / 拖拽音频到此处</div>
      <div class="small">flac · wav · mp3 · m4a · wma · ogg · aac</div>
      <input type="file" id="file-input" accept=".flac,.wav,.mp3,.m4a,.wma,.ogg,.aac">
    </div>
    <h2>🗂 检测历史</h2>
    <div id="task-list"></div>
  </section>

  <!-- 中栏 -->
  <section class="col">
    <h2>📄 检测报告</h2>
    <div id="report-wrap">
      <div id="report-empty">上传音频或点击左侧历史任务查看报告</div>
      <div id="report"></div>
    </div>
  </section>

  <!-- 右栏 -->
  <section class="col">
    <h2>💬 智能助手</h2>
    <div id="chat-box"></div>
    <div id="chat-row">
      <input id="chat-input" placeholder="问检测结果 / MFCC 是什么…" />
      <button id="chat-send">发送</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let sessionId = localStorage.getItem('chat_session') || '';
let selectedTask = localStorage.getItem('selected_task') || '';
const pollers = {};

// ---------- 服务状态 ----------
async function ping() {
  try {
    const r = await fetch('/health');
    $('svc-dot').className = 'dot ok';
    $('svc-text').textContent = '服务正常';
  } catch {
    $('svc-dot').className = 'dot';
    $('svc-text').textContent = '服务未连接';
  }
}
ping(); setInterval(ping, 15000);

// ---------- 上传 ----------
const dz = $('dropzone'), fi = $('file-input');
dz.onclick = () => fi.click();
dz.ondragover = e => { e.preventDefault(); dz.classList.add('dragover'); };
dz.ondragleave = () => dz.classList.remove('dragover');
dz.ondrop = e => {
  e.preventDefault(); dz.classList.remove('dragover');
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
};
fi.onchange = () => fi.files.length && upload(fi.files[0]);

async function upload(file) {
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/detect', { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    selectedTask = data.task_id;
    localStorage.setItem('selected_task', selectedTask);
    pollers[data.task_id] = setInterval(refreshTasks, 2000);
    refreshTasks();
  } catch (e) {
    alert('上传失败：' + e.message);
  }
}

// ---------- 任务列表（每 3s 刷新） ----------
const ST_LABEL = { pending: '排队中', running: '检测中', done: '已完成', failed: '失败' };

async function refreshTasks() {
  try {
    const res = await fetch('/api/tasks');
    const { tasks } = await res.json();
    const list = $('task-list');
    list.innerHTML = '';
    let hasRunning = false;
    for (const t of tasks) {
      if (t.status === 'running' || t.status === 'pending') hasRunning = true;
      const div = document.createElement('div');
      div.className = 'task' + (t.id === selectedTask ? ' active' : '');
      div.innerHTML = `
        <div class="name">${t.filename}</div>
        <div class="meta">
          <span class="st ${t.status}">${ST_LABEL[t.status] || t.status}</span>
          <span>${t.step}/5 ${t.step_name || ''}</span>
        </div>
        <div class="bar"><div style="width:${t.step / 5 * 100}%"></div></div>`;
      div.onclick = () => selectTask(t.id);
      list.appendChild(div);
    }
    if (!tasks.length) list.innerHTML =
      '<div style="color:var(--dim);font-size:12px;text-align:center;padding:20px">暂无任务</div>';
    if (!hasRunning) Object.values(pollers).forEach(clearInterval);
  } catch { /* 服务未起 */ }
}

async function selectTask(taskId) {
  selectedTask = taskId;
  localStorage.setItem('selected_task', taskId);
  refreshTasks();
  const res = await fetch(`/api/tasks/${taskId}?include_report=true`);
  const t = await res.json();
  if (t.status === 'done' && t.report_content) {
    showReport(t.report_content);
  } else if (t.status === 'failed') {
    $('report-empty').style.display = 'block';
    $('report-empty').textContent = '❌ 检测失败：' + (t.error || '');
    $('report').innerHTML = '';
  } else {
    $('report-empty').style.display = 'block';
    $('report-empty').textContent = `检测中… 步骤 ${t.step}/5 ${t.step_name}`;
    $('report').innerHTML = '';
  }
}

function showReport(md) {
  $('report-empty').style.display = 'none';
  let html = marked.parse(md);
  // 给风险等级加彩色徽章
  html = html.replace(/\*\*(高|中|低)风险\*\*/g, '**$1风险**<span class="risk $1">$1风险</span>');
  $('report').innerHTML = html;
}

refreshTasks();
setInterval(refreshTasks, 3000);
if (selectedTask) selectTask(selectedTask);

// ---------- 聊天 ----------
function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  $('chat-box').appendChild(div);
  $('chat-box').scrollTop = $('chat-box').scrollHeight;
  return div;
}

async function sendChat() {
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  const thinking = addMsg('assistant', '思考中…');
  $('chat-send').disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    sessionId = data.session_id;
    localStorage.setItem('chat_session', sessionId);
    thinking.querySelector('.bubble').textContent = data.reply;
  } catch (e) {
    thinking.querySelector('.bubble').textContent = '⚠️ ' + e.message;
  } finally {
    $('chat-send').disabled = false;
    $('chat-box').scrollTop = $('chat-box').scrollHeight;
  }
}
$('chat-send').onclick = sendChat;
// 注意：onkeydown 处理器返回 false 会阻止默认行为（导致无法删除文字），
// 所以这里用语句而不是 && 表达式；isComposing 避免中文输入法候选时误发送
$('chat-input').onkeydown = e => {
  if (e.key === 'Enter' && !e.isComposing) sendChat();
};

addMsg('assistant', '你好😊 上传音频后我会自动开始检测；检测完可以问我「这个音频有问题吗」，也可以问 MFCC、异常判定这类专业问题。');
</script>
</body>
</html>
